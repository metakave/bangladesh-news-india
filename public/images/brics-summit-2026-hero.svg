<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bricsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <radialGradient id="bricsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.18)" />
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0)" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bricsBg)" />
  <circle cx="600" cy="337" r="380" fill="url(#bricsGlow)" />

  <!-- Subtle Diplomatic Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1100" y1="0" x2="1100" y2="675" />
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <circle cx="600" cy="337" r="280" fill="none" />
  </g>

  <!-- Centered Official BRICS India Emblem Plate -->
  <g filter="url(#shadow)">
    <!-- White Card Base for pristine logo rendering -->
    <rect x="360" y="80" width="480" height="515" rx="24" fill="#ffffff" />
    <rect x="360" y="80" width="480" height="515" rx="24" fill="none" stroke="rgba(217, 119, 6, 0.35)" stroke-width="2" />
    
    <!-- Embedded Official BRICS 2026 Emblem -->
    <image href="/images/brics-summit-2026.png" x="385" y="105" width="430" height="465" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- Badge Top Right -->
  <g transform="translate(980, 45)">
    <rect width="175" height="34" rx="17" fill="rgba(217, 119, 6, 0.25)" stroke="#d97706" stroke-width="1.5" />
    <text x="87" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" text-anchor="middle">NEW DELHI 2026</text>
  </g>
</svg>
