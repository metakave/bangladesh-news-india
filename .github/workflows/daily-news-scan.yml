name: Daily News Scanner (Chunk 1: RSS Feeds)

on:
  schedule:
    # Runs everyday at 22:00 UTC (06:00 AM Beijing CST / 04:00 AM Dhaka BST)
    # Guaranteed within Beijing off-peak hours (18:00 - 09:00 CST)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan Mode'
        required: true
        default: 'rss'
        type: choice
        options:
          - rss
          - youtube
          - all

permissions:
  contents: write

jobs:
  scan-and-update-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute RSS News Scanner (Chunk 1)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'sk-cdc9e55a7d534a8e88338cd28b31342c' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_MODEL: 'deepseek-chat'
          SCAN_MODE: ${{ github.event.inputs.mode || 'rss' }}
        run: node scripts/daily-news-scanner.mjs --mode=${{ github.event.inputs.mode || 'rss' }}

      - name: Commit & Push Updated News Data
        run: |
          git config --global user.name "Narrative Compass Bot"
          git config --global user.email "bot@narrativecompass.bd"
          
          if [ -n "$(git status --porcelain src/data/news-data.ts)" ]; then
            git add src/data/news-data.ts
            git commit -m "🤖 Auto-update: Daily RSS Indian media scan [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin main
            echo "✅ RSS news articles committed and pushed to main!"
          else
            echo "ℹ️ No news changes detected in this cycle."
          fi
