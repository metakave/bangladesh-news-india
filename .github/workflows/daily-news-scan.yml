name: Daily DeepSeek News Scanner

on:
  schedule:
    # Runs everyday at 22:00 UTC (06:00 AM Beijing CST / 04:00 AM Dhaka BST)
    # Guaranteed within Beijing off-peak hours (18:00 - 09:00 CST)
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Daily DeepSeek News Scanner
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'sk-cdc9e55a7d534a8e88338cd28b31342c' }}
          DEEPSEEK_MODEL: 'deepseek-chat'
        run: npm run scan

      - name: Commit & Push Updated News Data
        run: |
          git config --global user.name "Narrative Compass Bot"
          git config --global user.email "bot@narrativecompass.bd"
          
          if [ -n "$(git status --porcelain src/data/news-data.ts)" ]; then
            git add src/data/news-data.ts
            git commit -m "🤖 Auto-update: Daily DeepSeek Indian media scan [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin main
            echo "✅ New articles committed and pushed to main!"
          else
            echo "ℹ️ No news changes detected in this cycle."
          fi
