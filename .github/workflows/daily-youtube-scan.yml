name: Daily News Scanner (Chunk 2: YouTube Channels)

on:
  schedule:
    # Runs everyday at 23:00 UTC (07:00 AM Beijing CST / 05:00 AM Dhaka BST)
    # Exactly 1 hour after Chunk 1 (RSS Feeds) at 22:00 UTC
    # Guaranteed within Beijing off-peak hours (18:00 - 09:00 CST)
    - cron: '0 23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  scan-and-update-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute YouTube News Scanner (Chunk 2)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'sk-cdc9e55a7d534a8e88338cd28b31342c' }}
          DEEPSEEK_MODEL: 'deepseek-chat'
          SCAN_MODE: 'youtube'
        run: node scripts/daily-news-scanner.mjs --mode=youtube

      - name: Commit & Push Updated News Data
        run: |
          git config --global user.name "Narrative Compass Bot"
          git config --global user.email "bot@narrativecompass.bd"
          
          if [ -n "$(git status --porcelain src/data/news-data.ts)" ]; then
            git add src/data/news-data.ts
            git commit -m "📺 Auto-update: Daily YouTube video news scan [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin main
            echo "✅ YouTube video dispatches committed and pushed to main!"
          else
            echo "ℹ️ No YouTube news changes detected in this cycle."
          fi
